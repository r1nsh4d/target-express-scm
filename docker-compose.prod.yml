# Production stack for a SHARED host.
#
# Isolation rules this file follows, because Laam already runs on this machine:
#
#   * `name:` pins the compose project, so containers, the network and volumes
#     are all namespaced and can never adopt another project's resources.
#   * Only ONE port is published - the web container - and it binds to
#     127.0.0.1. The host's existing reverse proxy forwards to it.
#   * Postgres and MinIO are reachable only on the internal compose network.
#     Uncomment their port blocks temporarily if you need to attach a client.
#   * Every published port is an environment variable, so a collision is a
#     one-line change in .env rather than an edit here.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: target-express

services:
  db:
    image: postgres:16-alpine
    container_name: tx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tx-db-data:/var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:${TX_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tx]

  # Object storage for proof-of-delivery photographs.
  #
  # Behind a profile because nothing uses it yet - the upload endpoints are not
  # built, so starting it would only consume memory and pull an image for no
  # reason. Turn it on when photo upload ships:
  #
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod \
  #     --profile storage up -d
  #
  # Pulled from quay.io, which is where MinIO actually publishes; the Docker Hub
  # mirror no longer serves a usable `latest`.
  minio:
    image: quay.io/minio/minio:latest
    container_name: tx-minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - tx-minio-data:/data
    # ports:
    #   - "127.0.0.1:${TX_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [tx]

  api:
    build:
      context: ./backend
    container_name: tx-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-target-express}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [tx]

  web:
    build:
      context: ./frontend
    container_name: tx-web
    restart: unless-stopped
    ports:
      # The ONLY published port. Host proxy forwards here.
      - "127.0.0.1:${TX_HTTP_PORT:-18080}:80"
    depends_on:
      - api
    networks: [tx]

volumes:
  tx-db-data:
  tx-minio-data:

networks:
  tx:
    name: target-express-net
