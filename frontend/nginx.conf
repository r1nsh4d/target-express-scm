# Serves the built SPA and forwards /api to the backend container.
#
# The host's own reverse proxy (whatever already fronts Laam) sits in front of
# this and terminates TLS; this server block only listens inside the compose
# network.

upstream tx_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;          # proof-of-delivery photographs

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://tx_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Brand artwork and the landing-page photograph. These are served from
    # fixed paths with no content hash, because the client replaces them by
    # dropping a file in — so they can NOT be marked immutable the way /assets
    # is. An hour is the compromise: long enough that a returning visitor is
    # not re-downloading the hero, short enough that a swapped logo shows up
    # the same morning. nginx still sends an ETag, so after that hour the
    # browser revalidates and usually gets a 304 rather than the bytes.
    location ~* ^/(hero\.jpg|brand/.*)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Everything else is the SPA: the router owns the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy strands clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
