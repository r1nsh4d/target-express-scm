# Local development stack.
#
# Explicit project name so container and volume names never collide with
# anything else on the host. Every published port binds to 127.0.0.1 and is
# overridable, because this has to share a machine with other applications.
name: target-express

services:
  db:
    image: postgres:16-alpine
    container_name: tx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-targetexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-targetexpress}
      POSTGRES_DB: ${POSTGRES_DB:-targetexpress}
    ports:
      - "127.0.0.1:${TX_DB_PORT:-55432}:5432"
    volumes:
      - tx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-targetexpress}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Not started by default: nothing uses it until photo upload ships.
  #   docker compose --profile storage up -d
  minio:
    image: quay.io/minio/minio:latest
    container_name: tx-minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-targetexpress}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-targetexpress}
    ports:
      - "127.0.0.1:${TX_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${TX_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - tx-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tx-db-data:
  tx-minio-data:
